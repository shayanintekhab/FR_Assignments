version: '3.8'

services:
  mysqldb-service:
    image: mysql:8.0
    container_name: mysql_container
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=user_db
    restart: always

  spring-boot-service:
    # public demo image from the official Spring guide
    image: springio/gs-spring-boot-docker
    container_name: spring_boot_container
    # note: that demo image listens on container port 8080
    ports:
      - "9090:8080"
    depends_on:
      - mysqldb-service
    restart: always

  reactjs-service:
    # generic Nginx image to serve static files
    image: nginx:alpine
    container_name: reactjs_container
    ports:
      - "81:80"
    # mount your built React app into Nginx (read‑only)
    volumes:
      - ./frontend/react-user-app/build:/usr/share/nginx/html:ro
    restart: always
